<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Challenge</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 20px; }
        .box { font-size: 32px; margin: 20px 0; font-weight: bold; background: #16213e; padding: 15px; border-radius: 10px; }
        input, button { padding: 12px; width: 80%; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #e94560; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🔢 Math Speed Challenge</h2>
    <div>⏱️ အချိန်: <span id="timer">20</span> စက္ကန့် | 🎯 Score: <span id="score">0</span></div>
    
    <div class="box" id="question">2 + 2 = ?</div>
    <input type="number" id="answer" placeholder="အဖြေရိုက်ပါ">
    <button onclick="checkAnswer()">Submit</button>
    <br><br>
    <a href="index.html" style="color:#aaa;">🔙 Menu သို့ပြန်သွားရန်</a>

    <script>
        const tg = window.Telegram.WebApp;
        let score = 0, timer = 20, currentAns = 0, interval;

        function newQuestion() {
            let n1 = Math.floor(Math.random() * 20) + 1;
            let n2 = Math.floor(Math.random() * 20) + 1;
            currentAns = n1 + n2;
            document.getElementById('question').innerText = `${n1} + ${n2} = ?`;
            document.getElementById('answer').value = '';
        }

        function checkAnswer() {
            let userAns = parseInt(document.getElementById('answer').value);
            if (userAns === currentAns) {
                score += 10;
                document.getElementById('score').innerText = score;
                newQuestion();
            }
        }

        interval = setInterval(() => {
            timer--;
            document.getElementById('timer').innerText = timer;
            if (timer <= 0) {
                clearInterval(interval);
                alert(`Game Over! Total Score: ${score}`);
                saveScore();
            }
        }, 1000);

        function saveScore() {
            const user = tg.initDataUnsafe?.user || { id: 12345, first_name: "Player" };
            fetch('/api/save-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: user.id, username: user.first_name, game_type: 'math', score: score })
            }).then(() => window.location.href = "index.html");
        }

        newQuestion();
    </script>
</body>
      </html>
